<div class="consulta-container">
  <div class="consulta-card">
    <h2 class="consulta-title">Consulta de Regras</h2>
    <div class="toolbar">
      <button class="btn btn-success" (click)="onNovo()">Novo</button>
      <button class="btn btn-primary" (click)="onPesquisar()">Pesquisar</button>
      <button class="btn btn-secondary" (click)="onFechar()">Fechar</button>
    </div>
    <div class="error-message" *ngIf="message">{{ message }}</div>
    <div class="grid-container">
      <table class="data-grid">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Limite Min</th>
            <th>Limite Max</th>
            <th>Prioridade</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of regras">
            <td>{{ item.nome }}</td>
            <td>{{ item.descricao }}</td>
            <td>{{ item.limiteMin }}</td>
            <td>{{ item.limiteMax }}</td>
            <td>{{ item.prioridade }}</td>
            <td><span class="badge" [ngClass]="item.status === 'A' ? 'badge-success' : 'badge-danger'">{{
                item.status === 'A' ? 'ATIVO' : 'INATIVO' }}</span></td>
          </tr>
          <tr *ngIf="regras.length === 0">
            <td colspan="6" style="text-align: center;">Nenhum registro encontrado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal" *ngIf="showPesquisaModal" (click)="closePesquisa()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>Pesquisar Regra</h2>
    <div class="form-group">
      <label for="tipoPesquisa">Pesquisar por:</label>
      <select id="tipoPesquisa" [(ngModel)]="tipoPesquisa" class="form-control">
        <option value="todos">Buscar Todos</option>
        <option value="id">Buscar por ID</option>
        <option value="tipoSensorId">Buscar por Tipo Sensor ID</option>
        <option value="sensorId">Buscar por Sensor ID</option>
        <option value="prioridade">Buscar por Prioridade</option>
        <option value="areaId">Buscar por Área ID</option>
      </select>
    </div>
    <div class="form-group" *ngIf="tipoPesquisa !== 'todos'">
      <label for="valorPesquisa">Valor:</label>
      <input *ngIf="tipoPesquisa !== 'prioridade'" type="text" id="valorPesquisa" [(ngModel)]="valorPesquisa"
        class="form-control">
      <select *ngIf="tipoPesquisa === 'prioridade'" id="valorPesquisa" [(ngModel)]="valorPesquisa" class="form-control">
        <option value="">Selecione</option>
        <option value="B">Baixa</option>
        <option value="M">Média</option>
        <option value="A">Alta</option>
        <option value="C">Crítica</option>
      </select>
    </div>
    <div class="modal-buttons">
      <button class="btn btn-primary" (click)="confirmarPesquisa()">Confirmar</button>
      <button class="btn btn-secondary" (click)="closePesquisa()">Cancelar</button>
    </div>
  </div>
</div>
