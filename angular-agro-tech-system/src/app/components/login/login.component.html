<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Acesso ao Sistema</h1>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Login</label>
        <input type="email" id="email" name="email" [(ngModel)]="loginData.email" required class="form-control"
          placeholder="Digite seu e-mail" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" [(ngModel)]="loginData.senha" required class="form-control"
          placeholder="Digite sua senha" autocomplete="current-password">
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">Entrar</button>
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
      </div>
    </form>

    <div class="novo-usuario-link">
      <a (click)="goToNovoUsuario()">Novo usuário</a>
    </div>
  </div>
</div>
