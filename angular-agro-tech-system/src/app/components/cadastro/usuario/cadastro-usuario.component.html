<div class="cadastro-container">
  <div class="cadastro-card">
    <h2 class="cadastro-title">Cadastro de Usuário</h2>

    <form (ngSubmit)="onSalvar()" #cadastroForm="ngForm">
      <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" [(ngModel)]="usuario.nome" required class="form-control"
          placeholder="Digite o nome completo">
      </div>

      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" [(ngModel)]="usuario.email" required class="form-control"
          placeholder="Digite o e-mail">
      </div>

      <div class="form-group">
        <label for="senhaHash">Senha *</label>
        <input type="password" id="senhaHash" name="senhaHash" [(ngModel)]="usuario.senhaHash" required
          class="form-control" placeholder="Digite a senha">
      </div>

      <div class="form-group">
        <label for="status">Status *</label>
        <select id="status" name="status" [(ngModel)]="usuario.status" required class="form-control">
          <option value="ATIVO">Ativo</option>
          <option value="INATIVO">Inativo</option>
        </select>
      </div>

      <div class="message" *ngIf="message" [ngClass]="messageType === 'success' ? 'success-message' : 'error-message'">
        {{ message }}
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn btn-secondary" (click)="onLimpar()">Limpar</button>
        <button type="button" class="btn btn-close" (click)="onFechar()">Fechar</button>
      </div>
    </form>
  </div>
</div>
