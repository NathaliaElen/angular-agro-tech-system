<div class="cadastro-container">
  <div class="cadastro-card">
    <h2 class="cadastro-title">Cadastro de Sensor</h2>

    <form (ngSubmit)="onSalvar()" #cadastroForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="codigo">Código *</label>
          <input type="text" id="codigo" name="codigo" [(ngModel)]="sensor.codigo" required class="form-control"
            placeholder="Digite o código do sensor">
        </div>

        <div class="form-group">
          <label for="tipoSensorId">Tipo Sensor *</label>
          <select id="tipoSensorId" name="tipoSensorId" [(ngModel)]="sensor.tipoSensorId" required class="form-control">
            <option value="">-- Selecione --</option>
            <option *ngFor="let ts of tiposSensores" [value]="ts.id">{{ ts.nome }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="areaId">Área *</label>
          <select id="areaId" name="areaId" [(ngModel)]="sensor.areaId" required class="form-control">
            <option value="">-- Selecione --</option>
            <option *ngFor="let a of areas" [value]="a.id">{{ a.nome }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="intervaloSegundos">Intervalo (segundos) *</label>
          <input type="number" id="intervaloSegundos" name="intervaloSegundos" [(ngModel)]="sensor.intervaloSegundos"
            required class="form-control" min="1">
        </div>
      </div>

      <div class="form-group">
        <label for="status">Status *</label>
        <select id="status" name="status" [(ngModel)]="sensor.status" required class="form-control">
          <option value="A">Ativo</option>
          <option value="I">Inativo</option>
        </select>
      </div>

      <div class="message" *ngIf="message" [ngClass]="messageType === 'success' ? 'success-message' : 'error-message'">
        {{ message }}
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn btn-secondary" (click)="onLimpar()">Limpar</button>
        <button type="button" class="btn btn-close" (click)="onFechar()">Fechar</button>
      </div>
    </form>
  </div>
</div>
