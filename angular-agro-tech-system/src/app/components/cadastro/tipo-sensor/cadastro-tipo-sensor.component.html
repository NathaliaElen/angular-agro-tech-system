<div class="cadastro-container">
  <div class="cadastro-card">
    <h2 class="cadastro-title">Cadastro de Tipo de Sensor</h2>

    <form (ngSubmit)="onSalvar()" #cadastroForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" name="nome" [(ngModel)]="tipoSensor.nome" required class="form-control"
            placeholder="Digite o nome do tipo de sensor">
        </div>

        <div class="form-group">
          <label for="unidadeMedida">Unidade de Medida *</label>
          <input type="text" id="unidadeMedida" name="unidadeMedida" [(ngModel)]="tipoSensor.unidadeMedida" required
            class="form-control" placeholder="Ex: °C, %, mm">
        </div>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" [(ngModel)]="tipoSensor.descricao" class="form-control" rows="3"
          placeholder="Digite a descrição"></textarea>
      </div>

      <div class="form-group">
        <label for="status">Status *</label>
        <select id="status" name="status" [(ngModel)]="tipoSensor.status" required class="form-control">
          <option value="ATIVO">Ativo</option>
          <option value="INATIVO">Inativo</option>
        </select>
      </div>

      <div class="message" *ngIf="message" [ngClass]="messageType === 'success' ? 'success-message' : 'error-message'">
        {{ message }}
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn btn-secondary" (click)="onLimpar()">Limpar</button>
        <button type="button" class="btn btn-close" (click)="onFechar()">Fechar</button>
      </div>
    </form>
  </div>
</div>
