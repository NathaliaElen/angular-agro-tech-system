<div class="cadastro-container">
  <div class="cadastro-card">
    <h2 class="cadastro-title">Cadastro de Área</h2>

    <form (ngSubmit)="onSalvar()" #cadastroForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="codigo">Código *</label>
          <input type="text" id="codigo" name="codigo" [(ngModel)]="area.codigo" required class="form-control"
            placeholder="Digite o código da área">
        </div>

        <div class="form-group">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" name="nome" [(ngModel)]="area.nome" required class="form-control"
            placeholder="Digite o nome da área">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="latitude">Latitude</label>
          <input type="number" id="latitude" name="latitude" [(ngModel)]="area.latitude" class="form-control"
            step="0.000001" placeholder="Digite a latitude">
        </div>

        <div class="form-group">
          <label for="longitude">Longitude</label>
          <input type="number" id="longitude" name="longitude" [(ngModel)]="area.longitude" class="form-control"
            step="0.000001" placeholder="Digite a longitude">
        </div>
      </div>

      <div class="form-group">
        <label for="status">Status *</label>
        <select id="status" name="status" [(ngModel)]="area.status" required class="form-control">
          <option value="A">Ativo</option>
          <option value="I">Inativo</option>
        </select>
      </div>

      <div class="message" *ngIf="message" [ngClass]="messageType === 'success' ? 'success-message' : 'error-message'">
        {{ message }}
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <button type="button" class="btn btn-secondary" (click)="onLimpar()">Limpar</button>
        <button type="button" class="btn btn-close" (click)="onFechar()">Fechar</button>
      </div>
    </form>
  </div>
</div>
